server {
    listen 80;
    server_name portfolio.medinaelput.my.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name portfolio.medinaelput.my.id;

    root /var/www/portfolio;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/portfolio.medinaelput.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.medinaelput.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
